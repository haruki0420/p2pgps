name: Docs

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "wiki/**"
      - "scripts/check-links.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "wiki/**"
      - "scripts/check-links.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check relative links
        run: python scripts/check-links.py
